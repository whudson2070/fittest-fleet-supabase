  function spawnObstacle() {
    if (state.tractorSpawned || state.bonus) return;
    const roll = Math.random();
    let kind, w, h, moveVx = 0, color = null;

    // Level 11+: chance to spawn a police car (in addition to other types)
    const policeChance = state.level >= 11
      ? Math.min(0.36, 0.16 + (state.level - 11) * 0.04)
      : 0;
    // Level 6+: chance to spawn a moving car (scales up with level)
    const carChance = state.level >= 6
      ? Math.min(0.48, 0.22 + (state.level - 6) * 0.05)
      : 0;

    if (state.level >= 11 && Math.random() < policeChance) {
      kind = "police";
      w = 76 + Math.random() * 14;
      h = 36 + Math.random() * 6;
      // Police approach a bit faster than civilian cars
      moveVx = -(130 + (state.level - 11) * 32 + Math.random() * 50);
      color = C.darkGrey;
    } else if (state.level >= 6 && Math.random() < carChance) {
      kind = "car";
      w = 70 + Math.random() * 18;
      h = 34 + Math.random() * 8;
      // Extra speed toward player (on top of world scroll) — faster each level
      moveVx = -(90 + (state.level - 6) * 28 + Math.random() * 40);
      const palette = [C.blue, C.darkGrey, C.brightRed, "#2E7D4F", "#6B5B95"];
      color = palette[Math.floor(Math.random() * palette.length)];
    } else if (roll < 0.4) {
      kind = "cone";
      w = 22;
      h = 36;
    } else if (roll < 0.7) {
      kind = "barrel";
      w = 28 + Math.random() * 8;
      h = 40 + Math.random() * 16;
    } else {
      kind = "barrier";
      w = 48 + Math.random() * 30;
      h = 24 + Math.random() * 8;
    }
    state.obstacles.push({
      x: W + 40,
      y: GROUND_Y - h,
      w,
      h,
      kind,
      moveVx,
      color,
    });
  }

  function aabb(a, b) {
    const padX = 6;
    const padY = 4;
    return (
      a.x + padX < b.x + b.w &&
      a.x + a.w - padX > b.x &&
      a.y + padY < b.y + b.h &&
      a.y + a.h - padY > b.y

  }

      return;
    }
    if (state.mode === "daybreak") {
      state.dusk = Math.max(0, state.dusk - dt / 2.8);
      if (state.dusk <= 0) finishDaybreak();
      return;
    }
    if (state.flash > 0) state.flash = Math.max(0, state.flash - dt);
    if (state.levelBanner > 0) state.levelBanner = Math.max(0, state.levelBanner - dt);
    if (state.invuln > 0) state.invuln = Math.max(0, state.invuln - dt);

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.life -= dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      if (!pt.text) pt.vy += 600 * dt;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }

    const scrollSpeed =
      state.mode === "over" ? 0 :
      state.mode === "play" ? state.speed :
      state.mode === "hop" ? state.speed * 0.4 :
      state.mode === "transition" ? state.speed * 2.2 :
      35;
    state.scroll += scrollSpeed * dt;

    for (const c of state.clouds) {
      c.x -= scrollSpeed * 0.12 * c.s * dt;
      if (c.x + c.w < -20) {
        c.x = W + Math.random() * 100;
        c.y = 30 + Math.random() * 120;
      }
    }
    for (const pole of state.poles) {
      pole.x -= scrollSpeed * 0.55 * dt;
      if (pole.x < -40) pole.x = W + Math.random() * 60;
    }

    // --- HOP INTO CAB ---
    if (state.mode === "hop") {
      state.hopTimer += dt;
      state.hopProgress = Math.min(1, state.hopTimer / 0.85);
      const p = state.player;
      const t = state.tractor;
      if (t && p) {
        const targetX = t.x + 28;
        const targetY = GROUND_Y - 78;
        const startX = 140;
        const startY = GROUND_Y - p.h;
        // parabolic hop arc
        const u = state.hopProgress;
        p.x = startX + (targetX - startX) * u;
        const arc = Math.sin(u * Math.PI) * 70;
        p.y = startY + (targetY - startY) * u - arc;
        p.squish = 1 + Math.sin(u * Math.PI) * 0.15;
      }
      // tractor keeps creeping slowly
      if (t) t.x -= state.speed * 0.15 * dt;

      if (state.hopProgress >= 1) {
        beginTransition();
      }
      return;
    }

    // --- DRIVE TO NEXT LEVEL ---
    if (state.mode === "transition") {
      state.transitionTimer += dt;
      if (state.tractor) {
        state.tractor.x -= state.speed * 2.2 * dt;
      }
      // fade out mid-transition, then start next level
      if (state.transitionTimer < 0.55) {
        state.fade = state.transitionTimer / 0.55;
      } else if (state.transitionTimer < 0.75) {
        state.fade = 1;
      } else if (state.transitionTimer < 1.15) {
        if (state.transitionTimer - dt < 0.75) {
          // swap under full fade: bonus exit, bonus offer, or next regular level
          if (state.bonus) {
            const next = state.nextRegularLevel;
            state.bonus = false;
            state.pickups = [];
            startLevel(next);
          } else if (state.level % 5 === 0) {
            state.score += 250 * state.level;
            syncContinueCharges();
            state.nextRegularLevel = state.level + 1;
            state.pendingBonusOffer = true;
          } else {
            state.score += 250 * state.level; // level clear bonus
            syncContinueCharges();
            startLevel(state.level + 1);
          }
          state.mode = "transition"; // keep until fade clears
          state.transitionTimer = 0.75;
          state.fade = 1;
        }
        state.fade = 1 - (state.transitionTimer - 0.75) / 0.4;
      } else {
        state.fade = 0;
        if (state.pendingBonusOffer) {
          state.pendingBonusOffer = false;
          state.mode = "bonusOffer";
          resetPlayer();
        } else {
          state.mode = "play";
        }
      }
      return;
    }

    if (state.mode !== "play") return;

    state.time += dt;
    const base = levelSpeedBase(state.level);
    const max = levelSpeedMax(state.level);
    state.speed = Math.min(max, base + state.time * (8 + state.level));
    state.score += state.speed * dt * 0.1;
    syncContinueCharges();
    state.distance += state.speed * dt;

    const p = state.player;

    if (state.jumpHeld && state.jumpHoldTimer > 0 && p.vy < 0) {
      p.vy += JUMP_HOLD_FORCE * dt;
      state.jumpHoldTimer -= dt;
    }

    p.vy += GRAVITY * dt;
    p.y += p.vy * dt;

    if (p.y + p.h >= GROUND_Y) {
      if (!p.onGround && p.vy > 200) {
        p.squish = 1.22;
        for (let i = 0; i < 4; i++) {
          state.particles.push({
            x: p.x + Math.random() * p.w,
            y: GROUND_Y,
            vx: (Math.random() - 0.5) * 80,
            vy: -10 - Math.random() * 30,
            life: 0.2,
            max: 0.2,
            r: 2 + Math.random() * 2,
            color: "rgba(65,64,66,0.3)",
          });
        }
      }
      p.y = GROUND_Y - p.h;
      p.vy = 0;
      p.onGround = true;
      state.coyote = COYOTE_TIME;
    } else {
      if (p.onGround) p.onGround = false;
      state.coyote = Math.max(0, state.coyote - dt);
    }

    p.squish += (1 - p.squish) * Math.min(1, 12 * dt);

    if (state.bonus) {
      updateBonus(dt, p);
      return;
    }

    // Spawn tractor near end of level (target distance grows each level)
    const targetDist = levelDist(state.level);
    if (!state.tractorSpawned && state.distance >= targetDist) {
      spawnTractor();
    }

    // Obstacle spawning (stop when tractor is coming / close)
    // Higher levels: tighter gaps + more frequent double spawns
    if (!state.tractorSpawned) {
      state.spawnTimer += dt;
      if (state.spawnTimer >= state.nextSpawn) {
        state.spawnTimer = 0;
        const minGap = Math.max(0.32, 0.55 - (state.level - 1) * 0.035);
        const gap = Math.max(
          minGap,
          1.22 - state.time * 0.02 - (state.level - 1) * 0.085
        );
        const jitter = Math.max(0.12, 0.38 - (state.level - 1) * 0.025);
        state.nextSpawn = gap + Math.random() * jitter;
        // Don't spawn too close to tractor appearance
        if (state.distance < targetDist - 350) {
          spawnObstacle();
          const doubleChance = Math.min(0.55, 0.16 + state.level * 0.045);
          if (state.time > 6 && Math.random() < doubleChance) {
            const delay = Math.max(90, 170 - state.level * 8) + Math.random() * 100;
            const capturedLevel = state.level;
            setTimeout(() => {
              if (state.mode === "play" && !state.bonus && state.level === capturedLevel && !state.tractorSpawned) {
                spawnObstacle();
              }
            }, delay);
          }
        }
      }
    }

    // Obstacles (cars add extra approach speed via moveVx)
    for (let i = state.obstacles.length - 1; i >= 0; i--) {
      const o = state.obstacles[i];
      o.x -= state.speed * dt;
      if (o.moveVx) o.x += o.moveVx * dt;
      if (o.x + o.w < -40) {
        state.obstacles.splice(i, 1);
        continue;
      }
      if (state.invuln <= 0 && aabb(p, o)) {
        midiBgm.playHitSfx();
        gameOver();
        return;
      }
    }

    // Tractor approach & reach
    if (state.tractor) {
      const t = state.tractor;
      // Tractor scrolls toward player a bit slower so player "catches up" feel
      // Actually: world scrolls left, tractor is ahead — move it with speed
      t.x -= state.speed * dt;

      // Successful reach: player overlaps tractor cab entry zone (front/rear of cab area)
      // Not crashing into the tall tractor side from a bad jump — require mostly on ground
      // and overlapping the cab/entry x-range
      const entryZone = {
        x: t.x + 10,
        y: GROUND_Y - 40,
        w: t.cabW + 20,
        h: 40,
      };
      if (aabb(p, entryZone) && p.y + p.h > GROUND_Y - 30) {
        beginHop();
        return;
      }

      // If tractor fully passed without hop, treat as miss → game over
      if (t.x + t.w < -30) {
        gameOver();
        return;
      }

      // Hitting the tall tractor body from mid-air (bad approach) = crash
      const bodyHit = {
        x: t.x + t.cabW,
        y: t.y + 20,
        w: t.w - t.cabW - 10,
        h: t.h - 20,
      };
      if (state.invuln <= 0 && aabb(p, bodyHit) && !p.onGround) {
        gameOver();
        return;
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function mixHex(a, b, t) {
    const pa = parseInt(a.slice(1), 16);
    const pb = parseInt(b.slice(1), 16);
    const ch = function (s, m) { return (s >> m) & 255; };
    const r = Math.round(ch(pa, 16) + (ch(pb, 16) - ch(pa, 16)) * t);
    const g = Math.round(ch(pa, 8) + (ch(pb, 8) - ch(pa, 8)) * t);
    const bl = Math.round(ch(pa, 0) + (ch(pb, 0) - ch(pa, 0)) * t);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }

  function drawBackground() {
    const k = (state.mode === "nightfall" || state.mode === "daybreak")
      ? state.dusk
      : (state.night ? 1 : (state.dusk || 0));
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, mixHex(C.skyTop, "#070B16", k));
    g.addColorStop(1, mixHex(C.skyBot, "#1A2438", k));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (k > 0.05) {
      ctx.globalAlpha = Math.min(0.75, k * 0.75);
      ctx.fillStyle = "#FFFFFF";
      for (let i = 0; i < 36; i++) {
        const sx = (i * 137) % W;
        const sy = (i * 61) % 200;
        const size = i % 5 === 0 ? 2 : 1;
        ctx.fillRect(sx, sy, size, size);
      }
      ctx.globalAlpha = 1;
    }

    const sunY = 70 + k * (GROUND_Y + 80 - 70);
    if (sunY < GROUND_Y + 8) {
      ctx.globalAlpha = Math.max(0, 1 - k);
      ctx.fillStyle = "rgba(255, 240, 180, 0.9)";
      ctx.beginPath();
      ctx.arc(W - 120, sunY, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    const moonY = GROUND_Y + 36 - k * (GROUND_Y + 36 - 68);
    if (k > 0.02 && moonY < GROUND_Y) {
      ctx.globalAlpha = Math.min(1, (k - 0.05) * 1.6);
      ctx.fillStyle = "rgba(232, 236, 244, 0.95)";
      ctx.beginPath();
      ctx.arc(W - 130, moonY, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = mixHex("#C5D9EB", "#10182A", k);
      ctx.beginPath();
      ctx.arc(W - 120, moonY - 6, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    for (const c of state.clouds) {
      ctx.fillStyle = k > 0.5 ? "rgba(160, 176, 200," + (0.75 - k * 0.59).toFixed(3) + ")" : "rgba(255,255,255," + (0.75 - k * 0.5).toFixed(3) + ")";
      roundRect(c.x, c.y, c.w, 20 * c.s, 10);
      ctx.fill();
      roundRect(c.x + c.w * 0.18, c.y - 14 * c.s, c.w * 0.55, 22 * c.s, 10);
      ctx.fill();
    }

    ctx.fillStyle = mixHex(C.grass, "#1A2820", k);
    ctx.fillRect(0, GROUND_Y - 18, W, 22);

    ctx.fillStyle = mixHex(C.asphalt, "#2A2C31", k);
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

    ctx.fillStyle = mixHex(C.asphaltDark, "#16181C", k);
    ctx.fillRect(0, GROUND_Y + 55, W, H - GROUND_Y - 55);

    ctx.fillStyle = k > 0.55 ? "rgba(230,231,232," + (1 - k * 0.62).toFixed(3) + ")" : C.white;
    ctx.fillRect(0, GROUND_Y, W, 3);
    ctx.fillRect(0, GROUND_Y + 52, W, 3);

    // Center lane dashes
    ctx.fillStyle = C.chartreuse;
    const dashW = 36;
    const gap = 28;
    const period = dashW + gap;
    const offset = state.scroll % period;
    for (let x = -offset; x < W + period; x += period) {
      ctx.fillRect(x, GROUND_Y + 24, dashW, 5);
    }

    // Shoulder rumble strip hint
    ctx.fillStyle = "rgba(190,15,52,0.35)";
    ctx.fillRect(0, GROUND_Y + 48, W, 2);

    // Highway poles / markers
    for (const pole of state.poles) {
      ctx.fillStyle = C.darkGrey;
      ctx.fillRect(pole.x, GROUND_Y - 70, 5, 70);
      ctx.fillStyle = C.red;
      roundRect(pole.x - 6, GROUND_Y - 78, 17, 14, 3);
      ctx.fill();
    }
  }

  function drawWorker(px, py, pw, ph, squish, running) {
    // Draws a person with red trucker cap, chartreuse safety vest, and work boots
    // Origin: top-left of bounding box (px, py), size pw x ph
    const sx = squish;
    const sy = 2 - squish;
    const cx = px + pw / 2;
    const by = py + ph;

    ctx.save();
    ctx.translate(cx, by);
    ctx.scale(sx, sy);
    ctx.translate(-cx, -by);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath();
    ctx.ellipse(cx, GROUND_Y + 3, pw * 0.55, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    const headR = 8;
    const headY = py + headR + 2;
    const torsoTop = headY + headR - 1;
    const torsoH = 22;
    const legTop = torsoTop + torsoH;
    const legH = ph - (legTop - py) - 8;
    const bootH = 8;

    // Head
    ctx.fillStyle = C.skin;
    ctx.beginPath();
    ctx.arc(cx, headY, headR, 0, Math.PI * 2);
    ctx.fill();

    // Eye looking forward
    ctx.fillStyle = C.darkGrey;
    ctx.beginPath();
    ctx.arc(cx + 3, headY - 1, 1.8, 0, Math.PI * 2);
    ctx.fill();

    // Red trucker cap (flat-ish crown + front brim/visor) — brand red
    // Crown (slightly flat top)
    ctx.fillStyle = C.red;
    ctx.beginPath();
    ctx.ellipse(cx - 1, headY - 4, headR + 2, 6.5, 0, Math.PI, 0);
    ctx.fill();
    roundRect(cx - headR - 2, headY - 5, headR * 2 + 2, 5, 2);
    ctx.fill();
    // Flat crown top
    ctx.fillStyle = C.darkRed;
    ctx.beginPath();
    ctx.ellipse(cx - 1, headY - 9.5, headR - 1, 2.8, 0, 0, Math.PI * 2);
    ctx.fill();
    // Front brim / visor (protrudes forward)
    ctx.fillStyle = C.red;
    ctx.beginPath();
    ctx.ellipse(cx + 7, headY - 2, 7, 2.4, -0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = C.darkRed;
    ctx.beginPath();
    ctx.ellipse(cx + 7, headY - 1.2, 6.5, 1.4, -0.15, 0, Math.PI * 2);
    ctx.fill();
    // Cap band seam
    ctx.strokeStyle = "rgba(0,0,0,0.2)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - headR - 1, headY - 2);
    ctx.lineTo(cx + headR - 2, headY - 2);
    ctx.stroke();

    // Arms (behind / simple)
    const armSwing = running && state.player && state.player.onGround
      ? Math.sin(state.scroll * 0.1) * 6
      : 0;
    ctx.strokeStyle = C.skinShadow;
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx - 10, torsoTop + 6);
    ctx.lineTo(cx - 16, torsoTop + 14 + armSwing);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 10, torsoTop + 6);
    ctx.lineTo(cx + 16, torsoTop + 14 - armSwing);
    ctx.stroke();

    // Torso / safety vest
    ctx.fillStyle = C.vest;
    roundRect(cx - 11, torsoTop, 22, torsoH, 4);
    ctx.fill();
    // Vest reflective stripes
    ctx.fillStyle = C.darkGrey;
    ctx.fillRect(cx - 11, torsoTop + 6, 22, 3);
    ctx.fillRect(cx - 11, torsoTop + 14, 22, 3);
    // Vest center zipper hint
    ctx.fillStyle = "rgba(65,64,66,0.35)";
    ctx.fillRect(cx - 1, torsoTop + 2, 2, torsoH - 4);

    // Legs (jeans)
    const legPhase = running ? Math.sin(state.scroll * 0.1) * 5 : 0;
    ctx.fillStyle = C.jeans;
    // back leg
    roundRect(cx - 9, legTop, 7, legH + legPhase * 0.3, 2);
    ctx.fill();
    // front leg
    roundRect(cx + 2, legTop, 7, legH - legPhase * 0.3, 2);
    ctx.fill();

    // Work boots (brown/tan)
    ctx.fillStyle = C.boot;
    roundRect(cx - 11, legTop + legH + legPhase * 0.3 - 2, 11, bootH, 2);
    ctx.fill();
    roundRect(cx + 1, legTop + legH - legPhase * 0.3 - 2, 11, bootH, 2);
    ctx.fill();
    ctx.fillStyle = C.bootDark;
    ctx.fillRect(cx - 11, legTop + legH + legPhase * 0.3 + 4, 11, 2);
    ctx.fillRect(cx + 1, legTop + legH - legPhase * 0.3 + 4, 11, 2);

    ctx.restore();
  }

  function drawPlayer() {
    const p = state.player;
    if (!p || !p.visible) return;
    if (state.invuln > 0 && Math.floor(state.invuln * 10) % 2 === 0) return;
    const running = state.mode === "play" || state.mode === "start";
    drawWorker(p.x, p.y, p.w, p.h, p.squish, running);
  }

  function drawCar(o) {
    const bodyColor = o.color || C.blue;
    const x = o.x;
    const y = o.y;
    const w = o.w;
    const h = o.h;

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.beginPath();
    ctx.ellipse(x + w / 2, GROUND_Y + 3, w * 0.42, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Lower body
    ctx.fillStyle = bodyColor;
    roundRect(x, y + h * 0.35, w, h * 0.55, 5);
    ctx.fill();

    // Cabin / roof
    ctx.fillStyle = bodyColor;
    roundRect(x + w * 0.22, y, w * 0.48, h * 0.48, 5);
    ctx.fill();

    // Windows
    ctx.fillStyle = "rgba(180, 220, 240, 0.9)";
    roundRect(x + w * 0.28, y + 4, w * 0.16, h * 0.28, 2);
    ctx.fill();
    roundRect(x + w * 0.48, y + 4, w * 0.16, h * 0.28, 2);
    ctx.fill();

    // Headlights (facing left — toward player)
    ctx.fillStyle = C.chartreuse;
    ctx.fillRect(x + 2, y + h * 0.5, 5, 6);
    ctx.fillStyle = C.brightRed;
    ctx.fillRect(x + w - 7, y + h * 0.5, 5, 6);

    // Wheels
    ctx.fillStyle = C.black;
    ctx.beginPath();
    ctx.arc(x + w * 0.22, y + h - 2, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w * 0.78, y + h - 2, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = C.lightGrey;
    ctx.beginPath();
    ctx.arc(x + w * 0.22, y + h - 2, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w * 0.78, y + h - 2, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPoliceCar(o) {
    const x = o.x;
    const y = o.y;
    const w = o.w;
    const h = o.h;
    const blink = Math.sin(performance.now() / 120) > 0;

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath();
    ctx.ellipse(x + w / 2, GROUND_Y + 3, w * 0.44, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body (black-and-white cruiser)
    ctx.fillStyle = C.white;
    roundRect(x, y + h * 0.32, w, h * 0.58, 5);
    ctx.fill();
    ctx.fillStyle = C.darkGrey;
    roundRect(x + w * 0.28, y + h * 0.32, w * 0.44, h * 0.58, 3);
    ctx.fill();

    // Cabin
    ctx.fillStyle = C.white;
    roundRect(x + w * 0.22, y + 2, w * 0.5, h * 0.42, 4);
    ctx.fill();
    ctx.fillStyle = "rgba(40, 60, 90, 0.85)";
    roundRect(x + w * 0.28, y + 6, w * 0.16, h * 0.26, 2);
    ctx.fill();
    roundRect(x + w * 0.48, y + 6, w * 0.16, h * 0.26, 2);
    ctx.fill();

    // Door badge / star hint
    ctx.fillStyle = C.blue;
    ctx.beginPath();
    ctx.arc(x + w * 0.5, y + h * 0.58, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = C.white;
    ctx.font = "bold 7px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("★", x + w * 0.5, y + h * 0.58);

    // Light bar on roof (flashing red / blue)
    ctx.fillStyle = C.darkGrey;
    roundRect(x + w * 0.32, y - 4, w * 0.36, 7, 2);
    ctx.fill();
    ctx.fillStyle = blink ? C.brightRed : C.blue;
    ctx.fillRect(x + w * 0.34, y - 3, w * 0.14, 5);
    ctx.fillStyle = blink ? C.blue : C.brightRed;
    ctx.fillRect(x + w * 0.52, y - 3, w * 0.14, 5);

    // Soft light glow
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = blink ? C.brightRed : C.blue;
    ctx.beginPath();
    ctx.arc(x + w * 0.4, y - 2, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = blink ? C.blue : C.brightRed;
    ctx.beginPath();
    ctx.arc(x + w * 0.6, y - 2, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Headlights / taillights
    ctx.fillStyle = C.chartreuse;
    ctx.fillRect(x + 2, y + h * 0.5, 5, 6);
    ctx.fillStyle = C.brightRed;
    ctx.fillRect(x + w - 7, y + h * 0.5, 5, 6);

    // Wheels
    ctx.fillStyle = C.black;
    ctx.beginPath();
    ctx.arc(x + w * 0.22, y + h - 2, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w * 0.78, y + h - 2, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = C.lightGrey;
    ctx.beginPath();
    ctx.arc(x + w * 0.22, y + h - 2, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w * 0.78, y + h - 2, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPickups() {
    for (const pk of state.pickups) {
      const cx = pk.x + pk.w / 2;
      const cy = pk.y + pk.h / 2;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 28px Arial, sans-serif";
      ctx.lineWidth = 4;
      ctx.strokeStyle = C.darkGrey;
      ctx.strokeText("$", cx, cy);
      ctx.fillStyle = C.chartreuse;
      ctx.fillText("$", cx, cy);
      ctx.textBaseline = "alphabetic";
    }
  }

  function drawObstacles() {
    for (const o of state.obstacles) {
      if (o.kind === "police") {
        drawPoliceCar(o);
      } else if (o.kind === "car") {
        drawCar(o);
      } else if (o.kind === "cone") {
        // Traffic cone
        ctx.fillStyle = C.brightRed;
        ctx.beginPath();
        ctx.moveTo(o.x + o.w / 2, o.y);
        ctx.lineTo(o.x + o.w, o.y + o.h);
        ctx.lineTo(o.x, o.y + o.h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = C.white;
        ctx.fillRect(o.x + 4, o.y + o.h * 0.4, o.w - 8, 5);
        ctx.fillStyle = C.darkGrey;
        ctx.fillRect(o.x - 3, o.y + o.h - 4, o.w + 6, 4);
      } else if (o.kind === "barrel") {
        ctx.fillStyle = C.darkRed;
        roundRect(o.x, o.y, o.w, o.h, 4);
        ctx.fill();
        ctx.fillStyle = C.white;
        ctx.fillRect(o.x + 2, o.y + o.h * 0.35, o.w - 4, 6);
        ctx.fillStyle = C.chartreuse;
        ctx.fillRect(o.x + 2, o.y + o.h * 0.55, o.w - 4, 4);
        ctx.fillStyle = "rgba(0,0,0,0.2)";
        ctx.fillRect(o.x, o.y, 4, o.h);
      } else {
        // Construction barrier
        ctx.fillStyle = C.red;
        roundRect(o.x, o.y, o.w, o.h, 3);
        ctx.fill();
        ctx.fillStyle = C.white;
        const stripe = 10;
        for (let i = 0; i < o.w; i += stripe * 2) {
          ctx.fillRect(o.x + i, o.y + 4, stripe, o.h - 8);
        }
        // Legs
        ctx.fillStyle = C.darkGrey;
        ctx.fillRect(o.x + 4, o.y + o.h, 4, 8);
        ctx.fillRect(o.x + o.w - 8, o.y + o.h, 4, 8);
      }
    }
  }

  function drawTractor() {
    const t = state.tractor;
    if (!t) return;

    const cabX = t.x;
    const tractorX = t.x + t.cabW - 4;
    const tractorW = t.w - t.cabW + 4;
    const roadY = GROUND_Y;

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.ellipse(t.x + t.w / 2, roadY + 4, t.w * 0.45, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // --- Tractor box ---
    ctx.fillStyle = C.white;
    roundRect(tractorX, t.y + 8, tractorW, t.h - 20, 4);
    ctx.fill();
    // Red branding panel
    ctx.fillStyle = C.red;
    ctx.fillRect(tractorX + 8, t.y + 28, tractorW - 16, 42);
    // "RUN" logo
    ctx.fillStyle = C.white;
    ctx.font = "italic bold 28px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("RUN", tractorX + tractorW / 2, t.y + 50);
    // Accent stripe
    ctx.fillStyle = C.chartreuse;
    ctx.fillRect(tractorX + 8, t.y + 70, tractorW - 16, 4);
    // Tractor outline
    ctx.strokeStyle = C.darkGrey;
    ctx.lineWidth = 2;
    roundRect(tractorX, t.y + 8, tractorW, t.h - 20, 4);
    ctx.stroke();

    // --- Cab ---
    ctx.fillStyle = C.red;
    roundRect(cabX, t.y + 25, t.cabW, t.h - 37, 6);
    ctx.fill();
    // Cab roof
    ctx.fillStyle = C.darkRed;
    roundRect(cabX + 4, t.y + 18, t.cabW - 14, 16, 4);
    ctx.fill();
    // Windshield
    ctx.fillStyle = C.blue;
    roundRect(cabX + 10, t.y + 36, 36, 28, 3);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fillRect(cabX + 14, t.y + 40, 12, 8);
    // Door line
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cabX + 52, t.y + 35);
    ctx.lineTo(cabX + 52, t.y + t.h - 20);
    ctx.stroke();
    // Side window
    ctx.fillStyle = "rgba(85,148,207,0.7)";
    roundRect(cabX + 56, t.y + 40, 22, 18, 2);
    ctx.fill();

    // Exhaust stack
    ctx.fillStyle = C.darkGrey;
    ctx.fillRect(cabX + t.cabW - 14, t.y - 5, 7, 30);

    // Wheels
    function wheel(wx, wy) {
      ctx.fillStyle = C.black;
      ctx.beginPath();
      ctx.arc(wx, wy, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.lightGrey;
      ctx.beginPath();
      ctx.arc(wx, wy, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    wheel(cabX + 28, roadY - 2);
    wheel(cabX + 68, roadY - 2);
    wheel(tractorX + 40, roadY - 2);
    wheel(tractorX + tractorW - 50, roadY - 2);
    wheel(tractorX + tractorW - 20, roadY - 2);

    // "Hop in!" prompt when close
    if (state.mode === "play" && t.x < W - 40 && t.x > 100) {
      const pulse = 0.6 + Math.sin(performance.now() / 250) * 0.4;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = C.red;
      ctx.font = "bold 16px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Reach the cab!", t.x + t.w / 2, t.y - 10);
      ctx.globalAlpha = 1;
    }
  }

  function drawParticles() {
    for (const pt of state.particles) {
      const a = Math.max(0, pt.life / (pt.max || 0.5));
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      if (pt.text) {
        ctx.font = "bold 18px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.strokeStyle = C.darkGrey;
        ctx.lineWidth = 3;
        ctx.strokeText(pt.text, pt.x, pt.y);
        ctx.fillText(pt.text, pt.x, pt.y);
        ctx.textBaseline = "alphabetic";
      } else {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.r * a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawHUD() {
    const score = Math.floor(state.score);

    // Score panel
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    roundRect(14, 12, 160, 58, 8);
    ctx.fill();
    ctx.strokeStyle = C.red;
    ctx.lineWidth = 2;
    roundRect(14, 12, 160, 58, 8);
    ctx.stroke();

    ctx.fillStyle = C.darkGrey;
    ctx.font = "bold 20px Arial, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("Score  " + score, 26, 36);

    ctx.fillStyle = C.red;
    ctx.font = "14px Arial, sans-serif";
    ctx.fillText("Best  " + highScore, 26, 56);

    // Level badge
    ctx.fillStyle = C.red;
    roundRect(W - 130, 14, 112, 36, 8);
    ctx.fill();
    ctx.fillStyle = C.white;
    ctx.font = "bold 18px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(state.bonus ? "Bonus" : "Level " + state.level, W - 74, 38);

    if (state.bonus && state.mode === "play") {
      ctx.fillStyle = C.darkGrey;
      ctx.font = "bold 14px Arial, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Packages  " + state.bonusCollected, 26, 90);
    }

    // Distance / progress to tractor
    if (state.mode === "play") {
      const progress = Math.min(1, state.distance / (state.bonus ? BONUS_DIST : levelDist(state.level)));
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      roundRect(W / 2 - 90, 16, 180, 14, 7);
      ctx.fill();
      ctx.fillStyle = C.red;
      roundRect(W / 2 - 90, 16, 180 * progress, 14, 7);
      ctx.fill();
      if (progress >= 1) {
        ctx.fillStyle = C.chartreuse;
        roundRect(W / 2 - 90, 16, 180, 14, 7);
        ctx.fill();
      }
      ctx.fillStyle = C.darkGrey;
      ctx.font = "11px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(
        state.bonus
          ? (progress >= 1 ? "Tractor ahead!" : "Bonus load")
          : (progress >= 1 ? "Tractor ahead!" : "To tractor"),
        W / 2, 48);
    }
  }

  function drawOverlay() {
    if (state.mode === "start") {
      ctx.fillStyle = "rgba(65, 64, 66, 0.55)";
      ctx.fillRect(0, 0, W, H);

      // Title card
      ctx.fillStyle = C.white;
      roundRect(W / 2 - 230, H / 2 - 130, 460, 250, 16);
      ctx.fill();
      ctx.strokeStyle = C.red;
      ctx.lineWidth = 4;
      roundRect(W / 2 - 230, H / 2 - 130, 460, 250, 16);
      ctx.stroke();

      // Red header bar
      ctx.fillStyle = C.red;
      roundRect(W / 2 - 230, H / 2 - 130, 460, 58, 16);
      ctx.fill();
      ctx.fillRect(W / 2 - 230, H / 2 - 88, 460, 16);

      ctx.textAlign = "center";
      ctx.fillStyle = C.white;
      ctx.font = "bold 36px Arial, sans-serif";
      ctx.fillText("Run Runner", W / 2, H / 2 - 92);

      ctx.fillStyle = C.darkGrey;
      ctx.font = "16px Arial, sans-serif";
      ctx.fillText("Dodge hazards · Reach the tractor", W / 2, H / 2 - 40);

      const pulse = 0.65 + Math.sin(performance.now() / 400) * 0.35;
      ctx.fillStyle = C.red;
      ctx.globalAlpha = 0.7 + pulse * 0.3;
      roundRect(W / 2 - 140, H / 2 - 10, 280, 44, 8);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = C.white;
      ctx.font = "bold 18px Arial, sans-serif";
      ctx.fillText("Press Space / Tap to start", W / 2, H / 2 + 18);

      ctx.fillStyle = "rgba(65,64,66,0.7)";
      ctx.font = "14px Arial, sans-serif";
      ctx.fillText("Hold jump for a higher leap", W / 2, H / 2 + 58);

      if (highScore > 0) {
        ctx.fillStyle = C.red;
        ctx.font = "bold 15px Arial, sans-serif";
        ctx.fillText("Best score: " + highScore, W / 2, H / 2 + 90);
      }
    }

    if (state.mode === "bonusOffer") {
      ctx.fillStyle = "rgba(65, 64, 66, 0.55)";
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = C.white;
      roundRect(W / 2 - 270, H / 2 - 140, 540, 280, 14);
      ctx.fill();
      ctx.strokeStyle = C.red;
      ctx.lineWidth = 4;
      roundRect(W / 2 - 270, H / 2 - 140, 540, 280, 14);
      ctx.stroke();

      ctx.fillStyle = C.red;
      roundRect(W / 2 - 270, H / 2 - 140, 540, 52, 14);
      ctx.fill();
      ctx.fillRect(W / 2 - 270, H / 2 - 104, 540, 16);

      ctx.textAlign = "center";
      ctx.fillStyle = C.white;
      ctx.font = "bold 28px Arial, sans-serif";
      ctx.fillText("Bonus load", W / 2, H / 2 - 106);

      ctx.fillStyle = C.darkGrey;
      ctx.font = "18px Arial, sans-serif";
      ctx.fillText("Your dispatcher has a bonus load.", W / 2, H / 2 - 58);
      ctx.fillText("Want to run it?", W / 2, H / 2 - 34);

      const yes = BONUS_BTNS.yes;
      ctx.fillStyle = C.chartreuse;
      roundRect(yes.x, yes.y, yes.w, yes.h, 8);
      ctx.fill();
      ctx.fillStyle = C.darkGrey;
      ctx.font = "bold 16px Arial, sans-serif";
      ctx.fillText("Yes. I'll take the bonus.", yes.x + yes.w / 2, yes.y + 27);

      const no = BONUS_BTNS.no;
      ctx.fillStyle = C.red;
      roundRect(no.x, no.y, no.w, no.h, 8);
      ctx.fill();
      ctx.fillStyle = C.white;
      ctx.font = "bold 16px Arial, sans-serif";
      ctx.fillText("No. I'll pass.", no.x + no.w / 2, no.y + 27);

      ctx.fillStyle = "rgba(65,64,66,0.65)";
      ctx.font = "13px Arial, sans-serif";
      ctx.fillText("Y to take it  ·  N to pass", W / 2, H / 2 + 122);
    }

    if (state.mode === "over") {
      ctx.fillStyle = "rgba(65, 64, 66, 0.6)";
      ctx.fillRect(0, 0, W, H);

      if (state.continueCharges > 0) {
        ctx.fillStyle = C.white;
        roundRect(W / 2 - 270, H / 2 - 130, 540, 260, 14);
        ctx.fill();
        ctx.strokeStyle = C.red;
        ctx.lineWidth = 4;
        roundRect(W / 2 - 270, H / 2 - 130, 540, 260, 14);
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = C.darkGrey;
        ctx.font = "bold 15px Arial, sans-serif";
        ctx.fillText("You must take a qualifying 10-hour rest break to continue.", W / 2, H / 2 - 64);

        const yes = OVER_BTNS.yes;
        ctx.fillStyle = C.chartreuse;
        roundRect(yes.x, yes.y, yes.w, yes.h, 8);
        ctx.fill();
        ctx.fillStyle = C.darkGrey;
        ctx.font = "bold 15px Arial, sans-serif";
        ctx.fillText("Yes. I'll take the rest break.", yes.x + yes.w / 2, yes.y + 27);

        const no = OVER_BTNS.no;
        ctx.fillStyle = C.red;
        roundRect(no.x, no.y, no.w, no.h, 8);
        ctx.fill();
        ctx.fillStyle = C.white;
        ctx.font = "bold 15px Arial, sans-serif";
        ctx.fillText("No. I'll end the run.", no.x + no.w / 2, no.y + 27);

        ctx.fillStyle = "rgba(65,64,66,0.6)";
        ctx.font = "13px Arial, sans-serif";
        ctx.fillText("Y to continue  ·  N to end the run", W / 2, H / 2 + 120);
      } else {
        ctx.fillStyle = C.white;
        roundRect(W / 2 - 260, H / 2 - 130, 520, 260, 14);
        ctx.fill();
        ctx.strokeStyle = C.darkRed;
        ctx.lineWidth = 4;
        roundRect(W / 2 - 260, H / 2 - 130, 520, 260, 14);
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = C.darkRed;
        ctx.font = "bold 18px Arial, sans-serif";
        ctx.fillText("Ouch! Call your fleet supervisor", W / 2, H / 2 - 78);
        ctx.fillText("to report this workplace injury.", W / 2, H / 2 - 54);

        ctx.fillStyle = C.darkGrey;
        ctx.font = "bold 24px Arial, sans-serif";
        ctx.fillText("Score  " + Math.floor(state.score), W / 2, H / 2 - 10);

        ctx.fillStyle = C.red;
        ctx.font = "16px Arial, sans-serif";
        ctx.fillText("Best  " + highScore + "  ·  Level " + state.level, W / 2, H / 2 + 22);

        const pulse = 0.65 + Math.sin(performance.now() / 400) * 0.35;
        const rb = OVER_BTNS.restartOnly;
        ctx.fillStyle = `rgba(190,15,52,${0.75 + pulse * 0.25})`;
        roundRect(rb.x, rb.y, rb.w, rb.h, 8);
        ctx.fill();
        ctx.fillStyle = C.white;
        ctx.font = "bold 16px Arial, sans-serif";
        ctx.fillText("Press Space / Tap to restart", W / 2, rb.y + 26);
      }
    }

    // Level banner
    if (state.levelBanner > 0 && (state.mode === "play" || state.mode === "transition")) {
      const a = Math.min(1, state.levelBanner * 2);
      ctx.globalAlpha = a;
      const banner = state.bonus ? "Bonus load" : "Level " + state.level;
      const bannerW = state.bonus ? 240 : 200;
      ctx.fillStyle = C.red;
      roundRect(W / 2 - bannerW / 2, H / 2 - 30, bannerW, 50, 10);
      ctx.fill();
      ctx.fillStyle = C.white;
      ctx.font = "bold 24px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(banner, W / 2, H / 2 + 2);
      ctx.globalAlpha = 1;
    }

    // Hop caption
    if (state.mode === "hop") {
      ctx.fillStyle = C.red;
      ctx.font = "bold 22px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Hopping in!", W / 2, 80);
    }

    // Transition caption
    if (state.mode === "transition" && state.fade < 0.9) {
      ctx.fillStyle = C.red;
      ctx.font = "bold 22px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Driving to next stop…", W / 2, 80);
    }

    // Fade overlay for level transition
    if (state.fade > 0) {
      ctx.fillStyle = `rgba(65,64,66,${state.fade})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state.flash > 0) {
      ctx.fillStyle = `rgba(215,21,58,${state.flash})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function draw() {
    drawBackground();
    drawObstacles();
    drawPickups();
    drawTractor();
    if (state.player) drawPlayer();
    drawParticles();
    drawHUD();
    drawOverlay();
  }

  resetPlayer();
  initDecor();

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const scale = Math.min(maxW / W, maxH / H);
    const cssW = Math.floor(W * scale);
    const cssH = Math.floor(H * scale);
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", fitCanvas);
  fitCanvas();
  ensureBgm();
})();
</script>
</body>
</html>
